{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <form class="form-card" method="post" action="/login">
        <h1>Welcome back</h1>
        <p>Sign in to access the document control dashboard.</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <label for="email">Email address</label>
        <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
        >

        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
        >

        <button class="button full-width" type="submit">Sign in</button>

        <p class="form-footer">
            No account? <a href="/register">Create one</a>
        </p>
    </form>
</section>
{% endblock %}

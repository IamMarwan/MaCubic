{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <form class="form-card" method="post" action="/register">
        <h1>Create account</h1>
        <p>Register to start managing your documents.</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <label for="full_name">Full name</label>
        <input
            id="full_name"
            name="full_name"
            type="text"
            required
            minlength="2"
            autocomplete="name"
        >

        <label for="email">Email address</label>
        <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
        >

        <label for="password">Password</label>
        <input
            id="password"
            name="password"
            type="password"
            required
            minlength="6"
            autocomplete="new-password"
        >

        <button class="button full-width" type="submit">Create account</button>

        <p class="form-footer">
            Already registered? <a href="/login">Sign in</a>
        </p>
    </form>
</section>
{% endblock %}

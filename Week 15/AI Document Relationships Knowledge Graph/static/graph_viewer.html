<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Relationship Graph</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #1f2937;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 1100px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .graph {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .node {
            border: 2px solid #2563eb;
            border-radius: 8px;
            padding: 14px;
            width: 220px;
            background: #eff6ff;
        }

        .node strong {
            display: block;
            color: #111827;
            margin-bottom: 6px;
        }

        .relationship {
            font-size: 13px;
            margin-top: 8px;
            color: #374151;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        pre {
            background: #111827;
            color: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Document Relationship Graph</h1>
        <p>
            This viewer displays project document relationships generated by the AI relationship engine.
        </p>

        <button onclick="loadRelationships()">Load Relationships</button>

        <div id="graph" class="graph"></div>

        <h2>Raw Relationship Data</h2>
        <pre id="rawData">Click "Load Relationships" to view data.</pre>
    </div>

    <script>
        async function loadRelationships() {
            const response = await fetch('/relationships/');
            const relationships = await response.json();

            const graph = document.getElementById('graph');
            const rawData = document.getElementById('rawData');

            graph.innerHTML = '';
            rawData.textContent = JSON.stringify(relationships, null, 2);

            relationships.forEach(item => {
                const node = document.createElement('div');
                node.className = 'node';

                node.innerHTML = `
                    <strong>${item.source_document}</strong>
                    <div class="relationship">
                        ${item.relationship_type}
                        <br>
                        ↓
                        <br>
                        <strong>${item.target_document}</strong>
                    </div>
                    <div class="relationship">
                        Confidence: ${item.confidence_score}%
                    </div>
                `;

                graph.appendChild(node);
            });
        }
    </script>
</body>
</html>
